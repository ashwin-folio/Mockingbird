# Mockingbird Settings
# ====================
# Core configuration for the design automation pipeline

# Image Generation Settings
image_generation:
  default_iterations: 2
  max_iterations: 4
  model: "google/gemini-3.1-flash-image-preview"  # NANO BANANA 2
  api_base_url: "https://openrouter.ai/api/v1"
  timeout_seconds: 120

# Security Settings
security:
  max_prompt_length: 2000
  daily_token_budget: 100000
  warn_at_budget_percent: 80
  blocked_patterns:
    - "ignore previous"
    - "disregard instructions"
    - "system prompt"
    - "jailbreak"
  require_cost_confirmation: true
  cost_per_1k_tokens:
    input: 0.0005
    output: 0.003

# Output Settings
output:
  directory: "outputs"
  image_format: "png"
  naming_pattern: "{use_case}_{timestamp}_{iteration}"
  keep_after_upload: true

# Figma Settings
figma:
  iterations_page_name: "Image Iterations"
  output_page_name: "Mockingbird Output"
  section_naming: "{use_case}_{MonDD_HHMM}"
  iteration_frame_size:
    width: 400
    height: 400
  frame_spacing: 40

# Brand Settings
brand:
  guidelines_path: "brand/brand_guidelines.md"
  assets_path: "brand/assets"
  asset_manifest: "brand/assets/asset_manifest.yaml"
  figma_assets_page: "Brand Assets"
  supported_formats:
    - ".svg"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".gif"
  asset_categories:
    - logos
    - icons
    - images
    - elements
  default_padding: 20
  auto_sync_on_start: false

# Placeholder Settings (for UI screens)
placeholders:
  fill_color: "#E5E7EB"
  stroke_color: "#9CA3AF"
  stroke_width: 1
  label_font_size: 12

# Font Fallback Chain (U4 fix)
fonts:
  fallback_chain:
    - "Inter"
    - "Arial"
    - "Helvetica"
    - "Roboto"
    - "SF Pro"
  notify_on_fallback: true

# UX Settings
ux:
  show_progress_feedback: true
  require_local_preview: false  # Set true to always preview before Figma upload
  show_cost_estimation: true
  enable_undo: true
  rate_limit_warnings:
    starter_warn_at: 3
    pro_warn_at_percent: 80
